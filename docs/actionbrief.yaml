analysisStructureBrief:
  overview: Applied multi-source spatial decision analysis for the August 2026 Nepal cascading-hazard corridor. The evidence
    chain moves from hazard reconstruction to exposure, modeled access loss, supported-domain social context, settlement priority,
    robustness, and road-repair screening while preserving spatial, survey, scenario, population-allocation, and engineering
    interpretation limits.
  levels:
  - levelName: Hazard reconstruction and exposure
    levelAim: Reconstruct a defensible cascading-hazard corridor and quantify physical and population exposure without equating
      exposure with confirmed damage.
    inputs:
    - Surface Change
    - Terrain Slope
    - Channel Context
    - Hazard Evidence Class
    - Hazard Scenario
    - Estimated Settlement Population
    modelOrMethod: Align independent radar, optical, mapped-event, terrain, and channel evidence on a 20 m grid; apply the
      pre-specified nested class-3, class-2, and class-1 evidence rules; overlay each footprint with calibrated population
      and mapped infrastructure.
    outputs:
    - Cascading-Hazard Evidence and Consensus Footprint
    - Hazard and Exposure Key Indicators
    - Evidence Base and Validation Status
    interpretation: Convergence across independent sources supports a coherent event corridor and descriptive exposure totals.
      The classes are evidence-confidence categories, not physical intensity, field-validated damage, or climate attribution.
  - levelName: Network disruption and population access loss
    levelAim: Estimate how evidence-linked road and facility disruptions change modeled settlement access to health and emergency
      destinations.
    inputs:
    - Topology repair threshold (m)
    - Settlement-to-road snap distance (m)
    - Road Closure Rule
    - Facility Availability Rule
    - Baseline health/emergency accessibility (minutes)
    - Estimated Settlement Population
    modelOrMethod: Build the pre-event routable baseline, remove evidence-eligible road edges and optional exposed destinations,
      rerun shortest paths, and report finite delays and newly isolated settlements separately across 192 structural scenarios.
      Apply four population-allocation thresholds and retain unallocated population explicitly.
    outputs:
    - Road Disruption and Service-Access Loss
    - Accessibility and Isolation Scenarios
    interpretation: The results identify modeled network mechanisms and assigned-population impacts conditional on graph topology,
      closure, facility, snap, and population-allocation assumptions. They do not verify field operating status.
  - levelName: Supported-domain vulnerability context
    levelAim: Describe pre-disaster deprivation, preparedness, assistance, and harmful coping only at geographic levels supported
      by the survey designs.
    inputs:
    - Economic Deprivation
    - Basic Needs Inadequacy
    - Essential Public Service Deprivation
    - Pre-Warning Deficit
    - Historical Assistance Receipt
    - Historical Food-Consumption Reduction Coping
    - Survey Reliability Category
    modelOrMethod: Use survey-weighted means, PSU- or household-clustered uncertainty, effective sample sizes, and reliability
      categories. Estimate NLSS district domains with empirical-Bayes shrinkage and keep NCCS ecological-belt and HRVS district-year
      estimates at their supported domains.
    outputs:
    - Pre-Disaster Vulnerability Profile by Supported Domain
    - Pre-Disaster Vulnerability Dimensions
    interpretation: These estimates describe contextual capacity and evidence strength. They are not 2026 disaster outcomes
      and are never treated as measured household or settlement vulnerability; Rasuwa and HRVS coverage limits remain explicit.
  - levelName: Settlement intervention priority
    levelAim: Identify settlements with high joint event-specific hazard evidence, assigned population, and isolation burden
      while keeping social context outside the primary score.
    inputs:
    - Hazard Evidence Class
    - Estimated Settlement Population
    - Newly Isolated
    - Accessibility Loss (minutes)
    - Settlement Contextual Vulnerability (Sensitivity Only)
    modelOrMethod: Within each eligible scenario set, combine tied-midrank hazard and exposure components with an isolation-preserving
      accessibility component using equal weights. Add shrinkage-adjusted district context only in a separately labelled four-component
      sensitivity score.
    outputs:
    - Settlement Exposure, Isolation, and Intervention Priority
    - Top 10 Priority Settlements
    interpretation: Primary ranks are transparent decision-support priorities, not causal effects or welfare estimates. The
      vulnerability sensitivity tests contextual rank movement and cannot establish settlement-level vulnerability.
  - levelName: Priority-rank robustness
    levelAim: Test whether high-priority settlements persist within each major uncertainty family and under an equal-family
      summary.
    inputs:
    - Priority Rank
    - Scenario Inclusion Frequency
    - Structural-Scenario Top-10 Frequency
    - Allocation-Threshold Top-10 Frequency
    - Weight-Rule Top-10 Frequency
    - Rank Stability
    - Median Priority Rank
    modelOrMethod: Evaluate 192 structural scenarios, four population-allocation thresholds, and 10,007 deterministic, random-weight,
      and functional-form specifications. Report each family separately, then assign one-third weight to each family for balanced
      top-ten frequency and rank intervals.
    outputs:
    - Priority-Rank Robustness Across Assumptions
    - Top 10 Priority Settlements
    interpretation: A robust priority must persist separately within structural, allocation, and weighting families. The family-balanced
      summary prevents the number of specifications in one family from dominating but does not replace the three family-specific
      verdicts.
  - levelName: Road-repair screening and portfolios
    levelAim: Screen which modeled road restorations reconnect assigned population or reduce finite service travel time and
      where additional sections cease to add benefit.
    inputs:
    - Critical Road Section
    - Repair Section Length (m)
    - Population Reconnected
    - Population-Weighted Finite Travel-Time Improvement (person-minutes)
    - Repair Portfolio Size (sections)
    modelOrMethod: Reopen each of 194 primary candidates individually, then construct nested count-constrained portfolios
      of 1, 2, 3, and 5 sections using lexicographic forward selection with full joint rerouting. Evaluate each fixed portfolio
      across all 192 structural scenarios.
    outputs:
    - Road-Repair Screening and Portfolio Benefits
    - Road-Repair Screening and Portfolio Scenarios
    interpretation: The screening separates reconnection from finite-delay improvement and preserves the zero marginal gain
      after two sections. It is not an engineering, cost-effectiveness, crew-scheduling, or globally optimal repair order;
      two-thirds retention means persistence of any modeled benefit only.
