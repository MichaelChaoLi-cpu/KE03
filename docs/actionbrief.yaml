datasetDictionary:
  S01:
    datasetSourceName: S01.dta
    datasetDescription: NCCS 2022 household composition and respondent-context module used for preparedness context.
    datasetAttribute: table
    datasetProvider: National Statistics Office Nepal (formerly Central Bureau of Statistics)
    datasetGenerationInfo: Public NCCS 2022 Stata module processed to nccs_2022_s01_preprocessed.parquet.
    datasetPeriod: '2022'
    datasetScale: 6,508 sampled households
    datasetSpatialResolution: National survey; public district, ward, latitude, and longitude values are masked and cannot
      support direct settlement linkage
    datasetTemporalResolution: Cross-sectional household survey
    datasetPreprocessingInfo: Approved labels were decoded to readable English; identifiers and survey weights were preserved;
      personal identifiers, unusable public geocodes, and fully missing fields were excluded; no missing values were imputed
      and no monetary losses were clipped or logged.
