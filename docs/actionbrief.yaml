    variableNameInArticle: Nested hazard-evidence footprint scenario
    variableAttribute: categorical
    variableUnit: category
    variableDescription: 'Nested hazard-evidence footprint scenario. Analytical role: robustness parameter. Construction and
      interpretation: The primary conservative, alternative mapped-or-multisensor, and sensitivity screening footprints use
      minimum evidence classes 3, 2, and 1, respectively.'
    variableSource: hazard_evidence
    observationNumber: 907506
  footprint_area_sq_km:
    variableNameInDataset: Footprint Area (sq km)
    variableNameInArticle: Scenario footprint area in square kilometres
    variableAttribute: continuous
    variableUnit: square kilometres
    variableDescription: 'Scenario footprint area in square kilometres. Analytical role: exposure denominator. Construction
      and interpretation: Sum the area of all non-NoData pixels meeting each scenario threshold.'
    variableSource: hazard_exposure
    observationNumber: 3
  exposed_population:
    variableNameInDataset: Exposed Population
    variableNameInArticle: Modeled population inside a scenario footprint
    variableAttribute: count
    variableUnit: persons
    variableDescription: 'Modeled population inside a scenario footprint. Analytical role: exposure outcome. Construction
      and interpretation: Reproject calibrated gridded population counts to the 20 m evidence grid with area-conserving sum
      resampling, then sum within each nested footprint. This is neither a casualty nor a displacement estimate.'
    variableSource: hazard_exposure
    observationNumber: 3
  population_share_of_analysis_scope:
    variableNameInDataset: Population Share of Analysis Scope (%)
    variableNameInArticle: Share of modeled analysis-scope population exposed under a scenario
    variableAttribute: count
    variableUnit: percent
    variableDescription: 'Share of modeled analysis-scope population exposed under a scenario. Analytical role: exposure outcome.
      Construction and interpretation: Use the modeled population inside the analysis scope as the denominator; do not use
      the full three-district population total.'
    variableSource: hazard_exposure
    observationNumber: 3
  exposed_road_length_km:
    variableNameInDataset: Exposed Road Length (km)
    variableNameInArticle: Approximate road length intersecting a scenario footprint
    variableAttribute: continuous
    variableUnit: kilometres
    variableDescription: 'Approximate road length intersecting a scenario footprint. Analytical role: infrastructure exposure
      outcome. Construction and interpretation: Sample road lines at intervals no greater than 20 m and sum represented segment
      length where the sampled evidence class meets the scenario threshold.'
    variableSource: hazard_exposure
    observationNumber: 3
  exposed_building_count:
    variableNameInDataset: Buildings Intersecting Footprint
    variableNameInArticle: Buildings intersecting a scenario footprint
    variableAttribute: count
    variableUnit: count
    variableDescription: 'Buildings intersecting a scenario footprint. Analytical role: infrastructure exposure outcome. Construction
      and interpretation: Count a building when its geometry touches at least one footprint pixel meeting the scenario threshold.
      Intersection indicates exposure, not confirmed structural damage.'
    variableSource: hazard_exposure
    observationNumber: 3
  exposed_bridge_count:
    variableNameInDataset: Bridges Intersecting Footprint
    variableNameInArticle: Bridges intersecting a scenario footprint
    variableAttribute: count
    variableUnit: count
    variableDescription: 'Bridges intersecting a scenario footprint. Analytical role: infrastructure exposure outcome. Construction
      and interpretation: Count a bridge when its geometry touches at least one footprint pixel meeting the scenario threshold.
      Intersection indicates exposure, not confirmed bridge failure.'
    variableSource: hazard_exposure
    observationNumber: 3
  directly_exposed_facility_count:
    variableNameInDataset: Facilities Directly Exposed
    variableNameInArticle: Facility points inside a scenario footprint
    variableAttribute: count
    variableUnit: count
    variableDescription: 'Facility points inside a scenario footprint. Analytical role: service exposure outcome. Construction
      and interpretation: Sample evidence class at each facility point. Report the separate count of facilities within 250
      m of a qualifying pixel as proximity exposure rather than direct exposure.'
    variableSource: hazard_exposure
    observationNumber: 3
  directly_exposed_settlement_count:
    variableNameInDataset: Settlements Directly Exposed
    variableNameInArticle: Settlement points inside a scenario footprint
    variableAttribute: count
    variableUnit: count
    variableDescription: 'Settlement points inside a scenario footprint. Analytical role: settlement exposure outcome. Construction
      and interpretation: Sample evidence class at each settlement point. Report the separate count of settlements within
      500 m of a qualifying pixel as proximity exposure rather than direct exposure.'
    variableSource: hazard_exposure
    observationNumber: 3
  disruption_candidate_edge_count:
    variableNameInDataset: CEMS Disruption Candidate Edges Intersecting Footprint
    variableNameInArticle: Evidence-linked graph edges intersecting a scenario footprint
    variableAttribute: count
    variableUnit: count
    variableDescription: 'Evidence-linked graph edges intersecting a scenario footprint. Analytical role: network disruption
      input. Construction and interpretation: Count graph edges carrying a rapid-mapping grade of possibly damaged, damaged,
      or destroyed when they intersect the scenario footprint. Multiple graph edges may represent one mapped road feature,
      so this is not a count of independently damaged roads.'
    variableSource: hazard_exposure
    observationNumber: 3
  road_closure_rule:
    variableNameInDataset: Road Closure Rule
    variableNameInArticle: Graded evidence-based road-closure assumption
    variableAttribute: categorical
    variableUnit: category
    variableDescription: 'Graded evidence-based road-closure assumption. Analytical role: network disruption and robustness
      parameter. Construction and interpretation: The primary analysis closes only graph edges graded Destroyed that intersect
      the selected hazard footprint. Robustness analysis closes every graded disruption-candidate edge intersecting the footprint.
      These are modeled assumptions, not field-confirmed closures.'
    variableSource: network_disruption
    observationNumber: 147264
  facility_availability_rule:
    variableNameInDataset: Facility Availability Rule
    variableNameInArticle: Scenario-specific health and emergency destination availability
    variableAttribute: categorical
    variableUnit: category
    variableDescription: 'Scenario-specific health and emergency destination availability. Analytical role: service disruption
      and sensitivity parameter. Construction and interpretation: Retain all mapped health and emergency destinations in the
      primary road-disruption analysis. In sensitivity analysis only, remove destinations whose point location is directly
      exposed within the selected hazard footprint. Direct exposure is not treated as observed facility failure.'
    variableSource: network_disruption
    observationNumber: 147264
  closed_edge_length_km:
    variableNameInDataset: Closed Edge Length (km)
    variableNameInArticle: Total modeled length of closed graph edges
    variableAttribute: continuous
    variableUnit: kilometres
    variableDescription: 'Total modeled length of closed graph edges. Analytical role: network disruption diagnostic. Construction
      and interpretation: Sum the metric length of graph edges closed by the scenario-specific road-closure rule. Multiple
      graph edges may represent one mapped road feature.'
    variableSource: network_disruption
    observationNumber: 192
  removed_health_emergency_destination_count:
    variableNameInDataset: Removed Health/Emergency Destinations
    variableNameInArticle: Number of service destinations excluded under a facility-loss scenario
    variableAttribute: count
    variableUnit: count
    variableDescription: 'Number of service destinations excluded under a facility-loss scenario. Analytical role: service
      disruption diagnostic. Construction and interpretation: Equal to zero in the primary analysis. In facility-loss sensitivity
      analysis, count directly exposed destination points removed from the multi-source shortest-path calculation.'
    variableSource: network_disruption
    observationNumber: 192
  post_disruption_service_reachable:
    variableNameInDataset: Post-Disruption Service Reachable
    variableNameInArticle: Modeled reachability of a health or emergency facility after disruption
    variableAttribute: boolean
    variableUnit: binary indicator
    variableDescription: 'Modeled reachability of a health or emergency facility after disruption. Analytical role: accessibility
      outcome. Construction and interpretation: Evaluate reachability on the scenario-specific disrupted graph and available
      destination set. Preserve missing values for settlements that were ineligible or unreachable at baseline.'
    variableSource: network_disruption
    observationNumber: 112176
  post_disruption_travel_time_minutes:
    variableNameInDataset: Post-Disruption Travel Time (minutes)
    variableNameInArticle: Modeled post-event travel time to the nearest available health or emergency facility
    variableAttribute: boolean
    variableUnit: minutes
    variableDescription: 'Modeled post-event travel time to the nearest available health or emergency facility. Analytical
      role: accessibility outcome. Construction and interpretation: Compute multi-source shortest paths on the disrupted graph
      after applying the road-closure and facility-availability rules. Preserve missing values for baseline-ineligible settlements
      and newly isolated settlements.'
    variableSource: network_disruption
    observationNumber: 108768
  accessibility_loss_minutes:
    variableNameInDataset: Accessibility Loss (minutes)
    variableNameInArticle: Increase in modeled service travel time after disruption
    variableAttribute: boolean
    variableUnit: minutes
    variableDescription: 'Increase in modeled service travel time after disruption. Analytical role: accessibility outcome.
      Construction and interpretation: Calculate the finite travel-time increase for baseline-eligible settlements that remain
      reachable. Preserve missing values for baseline-ineligible or newly isolated settlements; represent isolation with separate
      indicators.'
    variableSource: network_disruption
    observationNumber: 108768
  newly_isolated:
    variableNameInDataset: Newly Isolated
    variableNameInArticle: Baseline-reachable settlement with no modeled service path after disruption
    variableAttribute: boolean
    variableUnit: binary indicator
    variableDescription: 'Baseline-reachable settlement with no modeled service path after disruption. Analytical role: accessibility
      outcome. Construction and interpretation: Assign true only when the settlement was service-reachable on the confirmed
      baseline graph but becomes unreachable under the disruption scenario.'
    variableSource: network_disruption
    observationNumber: 112176
  accessibility_loss_is_infinite:
    variableNameInDataset: Accessibility Loss Is Infinite
    variableNameInArticle: Indicator that disruption changes finite baseline access to no available service path
    variableAttribute: boolean
    variableUnit: binary indicator
    variableDescription: 'Indicator that disruption changes finite baseline access to no available service path. Analytical
      role: accessibility outcome. Construction and interpretation: Assign true for newly isolated settlements, false for
      baseline-eligible settlements that remain reachable, and missing for baseline-ineligible settlements.'
    variableSource: network_disruption
    observationNumber: 112176
  accessibility_status:
    variableNameInDataset: Accessibility Status
    variableNameInArticle: Mutually exclusive modeled service-access outcome class
    variableAttribute: boolean
    variableUnit: binary indicator
    variableDescription: 'Mutually exclusive modeled service-access outcome class. Analytical role: accessibility outcome
      and reporting category. Construction and interpretation: Classify settlements in order as baseline ineligible, newly
      isolated, delayed by more than 5 minutes, or limited change. The 5-minute threshold is a reporting rule and will be
      tested in sensitivity analysis.'
    variableSource: network_disruption
    observationNumber: 147264
  population_allocation_threshold_m:
    variableNameInDataset: Allocation Threshold (m)
    variableNameInArticle: Maximum raster-cell-to-settlement assignment distance
    variableAttribute: count
    variableUnit: metres
    variableDescription: 'Maximum raster-cell-to-settlement assignment distance. Analytical role: population construction
      and sensitivity parameter. Construction and interpretation: Apply nested distance thresholds after constraining every
      nearest-settlement search to the same third-level administrative allocation unit.'
    variableSource: population_accessibility
    observationNumber: 3068
  population_cell_assignment_distance_m:
    variableNameInDataset: Nearest Settlement Distance (m)
    variableNameInArticle: Distance from a positive-population raster-cell centre to its nearest eligible settlement
    variableAttribute: count
    variableUnit: metres
    variableDescription: 'Distance from a positive-population raster-cell centre to its nearest eligible settlement. Analytical
      role: population linkage diagnostic. Construction and interpretation: Calculate Euclidean distance in EPSG:32645. Leave
      the nearest settlement missing when the cell''s allocation unit contains no mapped settlement.'
    variableSource: population_accessibility
    observationNumber: 228212
  estimated_settlement_population:
    variableNameInDataset: Estimated Settlement Population
    variableNameInArticle: Modeled pre-event population assigned to a settlement
    variableAttribute: count
    variableUnit: persons
    variableDescription: 'Modeled pre-event population assigned to a settlement. Analytical role: population exposure and
      weighting variable. Construction and interpretation: Assign each calibrated positive-population cell to no more than
      one nearest OSM settlement inside the same allocation unit. The primary value uses 3000 m and is not an observed settlement
      census.'
    variableSource: population_accessibility
    observationNumber: 3068
  has_assigned_population:
    variableNameInDataset: Has Assigned Population
    variableNameInArticle: Indicator that a settlement receives positive modeled population within the allocation threshold
    variableAttribute: boolean
    variableUnit: persons
    variableDescription: 'Indicator that a settlement receives positive modeled population within the allocation threshold.
      Analytical role: population coverage diagnostic. Construction and interpretation: Assign true when at least one positive-population
      cell is allocated to the settlement under threshold \(T\); do not impute zero-population settlements.'
    variableSource: population_accessibility
    observationNumber: 3068
  unallocated_population:
    variableNameInDataset: Unallocated Population
    variableNameInArticle: Calibrated population not assigned to any settlement under the selected threshold
    variableAttribute: count
    variableUnit: persons
    variableDescription: 'Calibrated population not assigned to any settlement under the selected threshold. Analytical role:
      population coverage diagnostic. Construction and interpretation: Retain population beyond threshold \(T\), outside an
      eligible allocation unit, or inside an allocation unit with no mapped settlement as unallocated. Do not redistribute
      this residual.'
    variableSource: population_accessibility
    observationNumber: 4
  newly_isolated_population:
    variableNameInDataset: Newly Isolated Population
    variableNameInArticle: Modeled population assigned to settlements that become isolated
    variableAttribute: boolean
    variableUnit: persons
    variableDescription: 'Modeled population assigned to settlements that become isolated. Analytical role: population-weighted
      accessibility outcome. Construction and interpretation: Sum primary-threshold settlement population where Newly Isolated
      is true. Unallocated population and baseline-ineligible settlements do not enter this total.'
    variableSource: population_accessibility
    observationNumber: 12
  population_delayed_over_5_minutes:
    variableNameInDataset: Population Delayed over 5 Minutes
    variableNameInArticle: Modeled population assigned to settlements with finite accessibility loss above five minutes
    variableAttribute: boolean
    variableUnit: persons
    variableDescription: 'Modeled population assigned to settlements with finite accessibility loss above five minutes. Analytical
      role: population-weighted accessibility outcome. Construction and interpretation: Sum primary-threshold settlement population
      among baseline-eligible settlements that remain reachable and exceed the reporting threshold.'
    variableSource: population_accessibility
    observationNumber: 12
  population_with_positive_accessibility_loss:
    variableNameInDataset: Population with Positive Accessibility Loss
    variableNameInArticle: Modeled population assigned to settlements with any positive finite travel-time increase
    variableAttribute: count
    variableUnit: persons
    variableDescription: 'Modeled population assigned to settlements with any positive finite travel-time increase. Analytical
      role: population-weighted accessibility outcome. Construction and interpretation: Sum primary-threshold settlement population
      only where finite accessibility loss is positive.'
    variableSource: population_accessibility
    observationNumber: 12
  population_weighted_accessibility_loss_person_minutes:
    variableNameInDataset: Population-Weighted Accessibility Loss (person-minutes)
    variableNameInArticle: Total modeled finite travel-time burden across assigned settlement population
    variableAttribute: boolean
    variableUnit: person-minutes
    variableDescription: 'Total modeled finite travel-time burden across assigned settlement population. Analytical role:
      population-weighted accessibility outcome. Construction and interpretation: Multiply finite settlement-level accessibility
      loss by assigned population and sum. Newly isolated settlements are reported separately rather than assigned an arbitrary
      finite penalty.'
    variableSource: population_accessibility
    observationNumber: 12
  population_weighted_mean_finite_accessibility_loss_minutes:
    variableNameInDataset: Population-Weighted Mean Finite Accessibility Loss (minutes)
    variableNameInArticle: Average modeled finite travel-time increase weighted by assigned settlement population
    variableAttribute: boolean
    variableUnit: minutes
    variableDescription: 'Average modeled finite travel-time increase weighted by assigned settlement population. Analytical
      role: population-weighted accessibility outcome. Construction and interpretation: Divide total person-minutes by assigned
      population with a finite post-disruption path. Interpret jointly with Newly Isolated Population.'
    variableSource: population_accessibility
    observationNumber: 12
  economic_deprivation:
    variableNameInDataset: Economic Deprivation
    variableNameInArticle: Household poverty and income-inadequacy domain score
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Household poverty and income-inadequacy domain score. Analytical role: contextual social vulnerability
      component. Construction and interpretation: Code Poverty Status equal to one and income reported as less than adequate
      as higher vulnerability. Require both indicators; apply no missing-value imputation.'
    variableSource: vulnerability_estimates
    observationNumber: 13
  basic_needs_inadequacy:
    variableNameInDataset: Basic Needs Inadequacy
    variableNameInArticle: Household basic-needs inadequacy domain score
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Household basic-needs inadequacy domain score. Analytical role: contextual social vulnerability
      component. Construction and interpretation: Code each response of less than adequate as one and just or more than adequate
      as zero. Treat not applicable as missing and require at least three valid indicators.'
    variableSource: vulnerability_estimates
    observationNumber: 13
  essential_public_service_deprivation:
    variableNameInDataset: Essential Public Service Deprivation
    variableNameInArticle: Household government-service deprivation domain score
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Household government-service deprivation domain score. Analytical role: contextual social vulnerability
      component. Construction and interpretation: Use government-facility ratings only. Code Bad as one and Good or Fair as
      zero, treat not applicable as missing, and require at least three valid indicators.'
    variableSource: vulnerability_estimates
    observationNumber: 13
  weighted_district_vulnerability_domain_estimate:
    variableNameInDataset: Estimate
    variableNameInArticle: Survey-weighted mean of a vulnerability domain within a district
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Survey-weighted mean of a vulnerability domain within a district. Analytical role: supported-domain
      survey estimate. Construction and interpretation: Link households to districts through the verified one-to-one PSU crosswalk
      and retain only positive household weights. Do not assign household values to settlements.'
    variableSource: vulnerability_estimates
    observationNumber: 39
  district_vulnerability_domain_standard_error:
    variableNameInDataset: Standard Error
    variableNameInArticle: PSU-clustered linearization standard error for a weighted district-domain estimate
    variableAttribute: continuous
    variableUnit: source-reported unit
    variableDescription: 'PSU-clustered linearization standard error for a weighted district-domain estimate. Analytical role:
      survey uncertainty diagnostic. Construction and interpretation: Estimate uncertainty from between-PSU variation. Preserve
      missing uncertainty when a district has fewer than two PSUs.'
    variableSource: vulnerability_estimates
    observationNumber: 36
  district_vulnerability_domain_95_ci:
    variableNameInDataset: CI 95% Low and CI 95% High
    variableNameInArticle: Cluster-adjusted uncertainty interval for a weighted district-domain estimate
    variableAttribute: continuous
    variableUnit: source-reported unit
    variableDescription: 'Cluster-adjusted uncertainty interval for a weighted district-domain estimate. Analytical role:
      survey uncertainty diagnostic. Construction and interpretation: Use a t critical value based on PSU count and bound
      proportional-domain intervals to zero and one. Do not report a direct interval for Rasuwa because only one PSU is observed.'
    variableSource: vulnerability_estimates
    observationNumber: 36
  survey_effective_sample_size:
    variableNameInDataset: Effective Sample Size
    variableNameInArticle: Weight-adjusted effective number of observations
    variableAttribute: continuous
    variableUnit: source-reported unit
    variableDescription: 'Weight-adjusted effective number of observations. Analytical role: survey precision diagnostic.
      Construction and interpretation: Calculate separately for every reported domain and indicator using complete observations
      with positive weights.'
    variableSource: vulnerability_estimates
    observationNumber: 39
  survey_reliability_category:
    variableNameInDataset: Reliability Category
    variableNameInArticle: Qualitative support category based on independent survey clusters
    variableAttribute: continuous
    variableUnit: source-reported unit
    variableDescription: 'Qualitative support category based on independent survey clusters. Analytical role: evidence-strength
      diagnostic. Construction and interpretation: Classify fewer than two PSUs as insufficient for design-based uncertainty,
      two to four as very limited, five to nine as limited, ten to twenty-nine as moderate, and thirty or more as broad contextual
      support.'
    variableSource: vulnerability_estimates
    observationNumber: 39
  district_social_vulnerability_percentile:
    variableNameInDataset: District Social Vulnerability Percentile
    variableNameInArticle: Equal-domain district vulnerability score before shrinkage
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Equal-domain district vulnerability score before shrinkage. Analytical role: contextual vulnerability
      diagnostic. Construction and interpretation: Orient every domain so higher values indicate greater vulnerability, percentile-scale
      across the thirteen Bagmati districts, and average the three domain percentiles equally. Exclude this score from the
      primary settlement ranking.'
    variableSource: vulnerability_estimates
    observationNumber: 13
  domain_shrinkage_weight:
    variableNameInDataset: Shrinkage Weight
    variableNameInArticle: Empirical-Bayes reliability weight for a district-domain estimate
    variableAttribute: continuous
    variableUnit: years
    variableDescription: 'Empirical-Bayes reliability weight for a district-domain estimate. Analytical role: vulnerability
      sensitivity parameter. Construction and interpretation: Estimate \(\tau_k^2\) as non-negative between-district variance
      after subtracting sampling variance; use the observed or PSU-count-adjusted sampling variance \(v_{d,k}\). Set the weight
      to zero when no between-district variance is resolvable.'
    variableSource: vulnerability_estimates
    observationNumber: 39
  shrinkage_adjusted_district_vulnerability_percentile:
    variableNameInDataset: Shrinkage-Adjusted District Vulnerability Percentile
    variableNameInArticle: Equal-domain vulnerability percentile after reliability shrinkage
    variableAttribute: continuous
    variableUnit: years
    variableDescription: 'Equal-domain vulnerability percentile after reliability shrinkage. Analytical role: sensitivity-only
      contextual vulnerability. Construction and interpretation: Shrink each domain toward its weighted Bagmati estimate before
      percentile scaling and equal-domain averaging. Use only as a sensitivity input, never as a measured settlement characteristic.'
    variableSource: vulnerability_estimates
    observationNumber: 13
  settlement_contextual_vulnerability_sensitivity_only:
    variableNameInDataset: Shrinkage-Adjusted District Vulnerability Percentile
    variableNameInArticle: District vulnerability context attached to a settlement for sensitivity analysis
    variableAttribute: categorical
    variableUnit: category
    variableDescription: 'District vulnerability context attached to a settlement for sensitivity analysis. Analytical role:
      settlement-priority sensitivity input. Construction and interpretation: Repeat the shrinkage-adjusted district percentile
      for settlements located in that district. Label it explicitly as district context and exclude it from the primary settlement
      ranking.'
    variableSource: vulnerability_estimates
    observationNumber: 13
  pre_warning_deficit:
    variableNameInDataset: No Pre-Warning Information
    variableNameInArticle: Share of households reporting no pre-warning information
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Share of households reporting no pre-warning information. Analytical role: supported-domain preparedness
      indicator. Construction and interpretation: Estimate only for Bagmati ecological-belt reporting domains using NCCS survey
      weights and PSU-clustered uncertainty. Do not downscale to districts or settlements.'
    variableSource: survey_supported_domains
    observationNumber: 2
  conditional_preparedness_deficit:
    variableNameInDataset: No Preparatory Action among Warned Households
    variableNameInArticle: Share of warned households reporting no preparatory action
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Share of warned households reporting no preparatory action. Analytical role: supported-domain preparedness
      indicator. Construction and interpretation: Restrict the denominator to households that received pre-warning. Report
      the very small eligible sample and cluster count explicitly.'
    variableSource: survey_supported_domains
    observationNumber: 2
  flood_landslide_risk_reduction_participation_deficit:
    variableNameInDataset: No Flood/Landslide Risk-Reduction Participation
    variableNameInArticle: Share of households reporting no flood or landslide risk-reduction participation
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Share of households reporting no flood or landslide risk-reduction participation. Analytical role:
      supported-domain preparedness indicator. Construction and interpretation: Estimate only for supported Bagmati ecological-belt
      domains; higher values indicate weaker preparedness context.'
    variableSource: survey_supported_domains
    observationNumber: 2
  historical_assistance_receipt:
    variableNameInDataset: Assistance Receipt
    variableNameInArticle: Weighted share of recorded historical shock episodes receiving assistance
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Weighted share of recorded historical shock episodes receiving assistance. Analytical role: supported-domain
      shock-response indicator. Construction and interpretation: Estimate by observed HRVS district and survey year for all
      recorded shock episodes. Cluster uncertainty by household and do not fill the absent Rasuwa domain.'
    variableSource: survey_supported_domains
    observationNumber: 6
  historical_food_consumption_reduction_coping:
    variableNameInDataset: Food-Consumption Reduction Coping
    variableNameInArticle: Weighted share of recorded historical shock episodes involving reduced food consumption or expenditure
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Weighted share of recorded historical shock episodes involving reduced food consumption or expenditure.
      Analytical role: supported-domain harmful-coping indicator. Construction and interpretation: Estimate by observed HRVS
      district and survey year for all recorded shock episodes. Treat as contextual historical evidence rather than a 2026
      event outcome.'
    variableSource: survey_supported_domains
    observationNumber: 6
  intervention_priority:
    variableNameInDataset: Intervention Priority
    variableNameInArticle: Equal-weight event-specific settlement priority score
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Equal-weight event-specific settlement priority score. Analytical role: primary decision outcome.
      Construction and interpretation: Average the tied-midrank Hazard and Exposure components with the isolation-preserving
      Accessibility component for settlements in the scenario-specific ranking set. District vulnerability is excluded.'
    variableSource: settlement_priority_robustness
    observationNumber: 84
  priority_rank:
    variableNameInDataset: Priority Rank
    variableNameInArticle: Descending primary settlement priority rank
    variableAttribute: ordinal
    variableUnit: rank
    variableDescription: 'Descending primary settlement priority rank. Analytical role: primary decision outcome. Construction
      and interpretation: Assign the same rank to tied Intervention Priority values and leave settlements outside the scenario-specific
      ranking set unranked.'
    variableSource: settlement_priority_robustness
    observationNumber: 84
  sensitivity_intervention_priority:
    variableNameInDataset: Sensitivity Intervention Priority
    variableNameInArticle: Equal-weight settlement priority score with district vulnerability context
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Equal-weight settlement priority score with district vulnerability context. Analytical role: sensitivity
      decision outcome. Construction and interpretation: Add the shrinkage-adjusted district vulnerability percentile as a
      fourth equal-weight sensitivity component. Do not interpret the result as measured settlement vulnerability.'
    variableSource: settlement_priority_robustness
    observationNumber: 84
  sensitivity_priority_rank:
    variableNameInDataset: Sensitivity Priority Rank
    variableNameInArticle: Descending vulnerability-sensitivity settlement rank
    variableAttribute: ordinal
    variableUnit: rank
    variableDescription: 'Descending vulnerability-sensitivity settlement rank. Analytical role: sensitivity decision outcome.
      Construction and interpretation: Rank only the same scenario-specific settlement set used by the primary score.'
    variableSource: settlement_priority_robustness
    observationNumber: 84
  sensitivity_rank_shift:
    variableNameInDataset: Sensitivity Rank Shift
    variableNameInArticle: Change in rank after adding district vulnerability context
    variableAttribute: continuous
    variableUnit: rank
    variableDescription: 'Change in rank after adding district vulnerability context. Analytical role: sensitivity diagnostic.
      Construction and interpretation: Positive values indicate movement toward higher priority after district context is
      added; negative values indicate movement toward lower priority.'
    variableSource: settlement_priority_robustness
    observationNumber: 84
  scenario_inclusion_frequency:
    variableNameInDataset: Scenario Inclusion Frequency
    variableNameInArticle: Share of structural scenarios in which a settlement enters the ranking set
    variableAttribute: categorical
    variableUnit: proportion from 0 to 1
    variableDescription: 'Share of structural scenarios in which a settlement enters the ranking set. Analytical role: coverage
      and robustness diagnostic. Construction and interpretation: Calculate over all 192 pre-specified hazard, closure, facility,
      topology, and snap-distance scenarios. Do not treat non-inclusion as a zero priority score.'
    variableSource: settlement_priority_robustness
    observationNumber: 767
  allocation_threshold_inclusion_frequency:
    variableNameInDataset: Allocation-Threshold Inclusion Frequency
    variableNameInArticle: Share of population-allocation specifications in which a settlement enters the primary-network
      ranking set
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Share of population-allocation specifications in which a settlement enters the primary-network ranking
      set. Analytical role: coverage and robustness diagnostic. Construction and interpretation: Calculate over the four pre-specified
      population-allocation thresholds of 500, 1000, 2000, and 3000 m while holding the primary hazard and network scenario
      fixed. Do not confuse population allocation with settlement-to-road snapping.'
    variableSource: settlement_priority_robustness
    observationNumber: 767
  structural_scenario_top_10_frequency:
    variableNameInDataset: Structural-Scenario Top-10 Frequency
    variableNameInArticle: Top-10 membership frequency within eligible structural scenarios
    variableAttribute: categorical
    variableUnit: proportion from 0 to 1
    variableDescription: 'Top-10 membership frequency within eligible structural scenarios. Analytical role: robustness outcome.
      Construction and interpretation: Calculate only from the 192 hazard, closure, facility, topology, and snap-distance
      scenarios in which the settlement is eligible. Report separately from weighting robustness.'
    variableSource: settlement_priority_robustness
    observationNumber: 117
  allocation_threshold_top_10_frequency:
    variableNameInDataset: Allocation-Threshold Top-10 Frequency
    variableNameInArticle: Top-10 membership frequency within eligible primary-network population-allocation specifications
    variableAttribute: continuous
    variableUnit: proportion from 0 to 1
    variableDescription: 'Top-10 membership frequency within eligible primary-network population-allocation specifications.
      Analytical role: robustness outcome. Construction and interpretation: Calculate from the four population-allocation
      thresholds while holding the primary hazard, closure, facility, topology, and settlement-to-road rules fixed. Report
      separately from structural and weighting robustness.'
    variableSource: settlement_priority_robustness
    observationNumber: 84
  weight_rule_top_10_frequency:
    variableNameInDataset: Weight-Rule Top-10 Frequency
    variableNameInArticle: Top-10 membership frequency within primary-scenario weighting and functional-form specifications
    variableAttribute: categorical
    variableUnit: proportion from 0 to 1
    variableDescription: 'Top-10 membership frequency within primary-scenario weighting and functional-form specifications.
      Analytical role: robustness outcome. Construction and interpretation: Calculate from six deterministic alternatives,
      one geometric specification, and 10,000 seeded Dirichlet draws for primary-ranking settlements. Monte Carlo draw count
      controls precision, not robustness-family influence.'
    variableSource: settlement_priority_robustness
    observationNumber: 84
  rank_stability:
    variableNameInDataset: Rank Stability
    variableNameInArticle: Family-balanced top-10 membership frequency
    variableAttribute: continuous
    variableUnit: rank
    variableDescription: 'Family-balanced top-10 membership frequency. Analytical role: robustness outcome. Construction and
      interpretation: Give structural-scenario, population-allocation, and weighting families equal influence regardless of
      their specification counts. Preserve all family-specific frequencies alongside the balanced summary.'
    variableSource: settlement_priority_robustness
    observationNumber: 84
  median_priority_rank:
    variableNameInDataset: Median Priority Rank
    variableNameInArticle: Family-balanced median rank across retained eligible robustness families
    variableAttribute: ordinal
    variableUnit: rank
    variableDescription: 'Family-balanced median rank across retained eligible robustness families. Analytical role: robustness
      outcome. Construction and interpretation: Compute weighted rank quantiles by assigning total weight one-third to each
      available family and equal weight within family. Report balanced IQR and P05-P95 intervals and preserve complete family-specific
      rank surfaces.'
    variableSource: settlement_priority_robustness
    observationNumber: 84
  critical_road_section:
    variableNameInDataset: Critical Road Section
    variableNameInArticle: OSM road-feature repair candidate label
    variableAttribute: categorical
    variableUnit: category
    variableDescription: 'OSM road-feature repair candidate label. Analytical role: repair-screening identifier. Construction
      and interpretation: Group non-overlapping graph edges by OSM feature. The primary candidate set requires Hazard Evidence
      Class 3 and CEMS Damage Grade equal to Destroyed.'
    variableSource: road_repair_benefits
    observationNumber: 194
  is_critical_road_section:
    variableNameInDataset: Is Critical Road Section
    variableNameInArticle: Indicator of positive modeled marginal access benefit
    variableAttribute: categorical
    variableUnit: category
    variableDescription: 'Indicator of positive modeled marginal access benefit. Analytical role: repair-screening outcome.
      Construction and interpretation: Restore one candidate section at a time while all other primary closures remain fixed.
      This is a screening classification, not an engineering repair order.'
    variableSource: road_repair_benefits
    observationNumber: 194
  repair_section_length_m:
    variableNameInDataset: Repair Section Length (m)
    variableNameInArticle: Total modeled length of graph edges reopened for one candidate
    variableAttribute: categorical
    variableUnit: metres
    variableDescription: 'Total modeled length of graph edges reopened for one candidate. Analytical role: repair-screening
      diagnostic. Construction and interpretation: Sum only primary-scenario closed graph edges belonging to the candidate
      OSM feature. It is not a field-measured repair length or cost proxy.'
    variableSource: road_repair_benefits
    observationNumber: 194
  restored_access_after_repair:
    variableNameInDataset: Restored Access after Repair
    variableNameInArticle: Newly isolated settlement regaining a finite modeled service path after one candidate repair
    variableAttribute: continuous
    variableUnit: source-reported unit
    variableDescription: 'Newly isolated settlement regaining a finite modeled service path after one candidate repair. Analytical
      role: repair-screening outcome. Construction and interpretation: Reopen all primary-closed graph edges of candidate
      section \(j\) and retain every other primary closure. Preserve missing values for baseline-ineligible settlements.'
    variableSource: road_repair_benefits
    observationNumber: 194
  population_reconnected:
    variableNameInDataset: Population Reconnected
    variableNameInArticle: Assigned settlement population regaining modeled service access after one candidate repair
    variableAttribute: boolean
    variableUnit: persons
    variableDescription: 'Assigned settlement population regaining modeled service access after one candidate repair. Analytical
      role: repair-screening outcome. Construction and interpretation: Sum only population assigned within 3000 m to settlements
      that were newly isolated in the primary disruption and regain a finite path. Unallocated population is excluded and
      reported separately.'
    variableSource: road_repair_benefits
    observationNumber: 194
  post_repair_travel_time_minutes:
    variableNameInDataset: Post-Repair Travel Time (minutes)
    variableNameInArticle: Modeled travel time to the nearest retained health or emergency destination after one candidate
      repair
    variableAttribute: continuous
    variableUnit: minutes
    variableDescription: 'Modeled travel time to the nearest retained health or emergency destination after one candidate
      repair. Analytical role: repair-screening outcome. Construction and interpretation: Use the primary disrupted graph
      with candidate section \(j\) reopened. Retain all primary health and emergency destinations and preserve missing values
      when no finite path exists.'
    variableSource: road_repair_benefits
    observationNumber: 114461
  finite_travel_time_improvement_after_repair_minutes:
    variableNameInDataset: Finite Travel-Time Improvement after Repair (minutes)
    variableNameInArticle: Reduction in finite modeled travel time after one candidate repair
    variableAttribute: continuous
    variableUnit: minutes
    variableDescription: 'Reduction in finite modeled travel time after one candidate repair. Analytical role: repair-screening
      outcome. Construction and interpretation: Keep reconnected settlements separate rather than assigning an arbitrary finite
      improvement to a formerly infinite path. Nonnegative values are required by validation.'
    variableSource: road_repair_benefits
    observationNumber: 114460
  population_weighted_finite_travel_time_improvement_person_minutes:
    variableNameInDataset: Population-Weighted Finite Travel-Time Improvement (person-minutes)
    variableNameInArticle: Total finite travel-time improvement weighted by assigned settlement population
    variableAttribute: count
    variableUnit: person-minutes
    variableDescription: 'Total finite travel-time improvement weighted by assigned settlement population. Analytical role:
      repair-screening outcome. Construction and interpretation: Sum only positive finite improvements. Interpret jointly
      with Population Reconnected and do not convert the result into cost-effectiveness without Nepal-specific engineering
      cost evidence.'
    variableSource: road_repair_benefits
    observationNumber: 194
  repair_portfolio_size_sections:
    variableNameInDataset: Repair Portfolio Size (sections)
    variableNameInArticle: Number of road sections in a count-constrained repair-screening portfolio
    variableAttribute: count
    variableUnit: count
    variableDescription: 'Number of road sections in a count-constrained repair-screening portfolio. Analytical role: repair-portfolio
      scenario parameter. Construction and interpretation: Select a nested forward sequence using joint rerouting after every
      added Critical Road Section. Report the four confirmed section counts without treating a larger portfolio as inherently
      better.'
    variableSource: road_repair_portfolios
    observationNumber: 4
  portfolio_population_reconnected:
    variableNameInDataset: Portfolio Population Reconnected
    variableNameInArticle: Assigned settlement population regaining modeled service access after jointly reopening a road-repair
      portfolio
    variableAttribute: boolean
    variableUnit: persons
    variableDescription: 'Assigned settlement population regaining modeled service access after jointly reopening a road-repair
      portfolio. Analytical role: repair-portfolio outcome. Construction and interpretation: Jointly reopen the primary candidate-edge
      groups in portfolio \(\mathcal{J}_K\), rerun shortest paths, and sum assigned population at scenario-specific newly
      isolated settlements that regain a finite path. Do not add single-section marginal benefits.'
    variableSource: road_repair_portfolios
    observationNumber: 768
  portfolio_weighted_finite_travel_time_improvement_person_minutes:
    variableNameInDataset: Portfolio-Weighted Finite Travel-Time Improvement (person-minutes)
    variableNameInArticle: Total finite modeled travel-time improvement after jointly reopening a road-repair portfolio
    variableAttribute: continuous
    variableUnit: person-minutes
    variableDescription: 'Total finite modeled travel-time improvement after jointly reopening a road-repair portfolio. Analytical
      role: repair-portfolio outcome. Construction and interpretation: Multiply each positive finite travel-time improvement
      by assigned settlement population and sum. Keep reconnected settlements separate instead of assigning an arbitrary finite
      improvement to a previously infinite path.'
    variableSource: road_repair_portfolios
    observationNumber: 768
  portfolio_structural_scenario_retention:
    variableNameInDataset: Portfolio Structural-Scenario Retention
    variableNameInArticle: Share of structural scenarios in which a fixed primary repair portfolio retains any positive modeled
      access benefit
    variableAttribute: categorical
    variableUnit: category
    variableDescription: 'Share of structural scenarios in which a fixed primary repair portfolio retains any positive modeled
      access benefit. Analytical role: repair-portfolio robustness outcome. Construction and interpretation: Evaluate each
      fixed primary forward portfolio across all 192 hazard, closure, facility, topology, and snap-distance scenarios. Positive
      retention means population reconnection or finite person-minute improvement; it does not measure benefit magnitude or
      engineering robustness.'
    variableSource: road_repair_portfolios
    observationNumber: 4
