    datasetPeriod: 2022/23
    datasetScale: 9,600 sampled households
    datasetSpatialResolution: National survey; Bagmati district estimates use validated PSU linkage and survey weights
    datasetTemporalResolution: Cross-sectional household survey
    datasetPreprocessingInfo: Approved labels were decoded to readable English; identifiers and survey weights were preserved;
      personal identifiers, unusable public geocodes, and fully missing fields were excluded; no missing values were imputed
      and no monetary losses were clipped or logged.
  Section_0:
    datasetSourceName: Section_0.dta (HRVS waves 1-3)
    datasetDescription: HRVS community and household location modules used to retain observed district and panel identifiers.
    datasetAttribute: table
    datasetProvider: World Bank Household Risk and Vulnerability Survey team
    datasetGenerationInfo: Public wave-specific Stata modules were standardized and pooled across three survey waves.
    datasetPeriod: 2016-2018
    datasetScale: Three annual waves; 400 community records per wave before linkage
    datasetSpatialResolution: Observed survey districts; Rasuwa is not sampled and Nuwakot coverage is retained as contextual
      evidence
    datasetTemporalResolution: Annual panel waves
    datasetPreprocessingInfo: Approved labels were decoded to readable English; identifiers and survey weights were preserved;
      personal identifiers, unusable public geocodes, and fully missing fields were excluded; no missing values were imputed
      and no monetary losses were clipped or logged.
  Section_15a:
    datasetSourceName: Section_15a.dta (HRVS waves 1-3)
    datasetDescription: HRVS household shock, loss, assistance, and coping module pooled across three waves.
    datasetAttribute: table
    datasetProvider: World Bank Household Risk and Vulnerability Survey team
    datasetGenerationInfo: Public wave-specific Stata modules were standardized and pooled to hrvs_2016_2018_shock_panel_preprocessed.parquet.
    datasetPeriod: 2016-2018
    datasetScale: 12,092 household-shock-wave records
    datasetSpatialResolution: Observed survey districts; event-area evidence is available for Nuwakot but not Rasuwa
    datasetTemporalResolution: Annual household panel waves with shock episodes
    datasetPreprocessingInfo: Approved labels were decoded to readable English; identifiers and survey weights were preserved;
      personal identifiers, unusable public geocodes, and fully missing fields were excluded; no missing values were imputed
      and no monetary losses were clipped or logged.
  network_accessibility:
    datasetSourceName: road_edges_preprocessed.parquet and settlement_baseline_accessibility_preprocessed.parquet
    datasetDescription: Pre-event routable OSM road graph and baseline settlement access to health or emergency destinations.
    datasetAttribute: table
    datasetProvider: OpenStreetMap contributors via Geofabrik; research-team derivatives
    datasetGenerationInfo: A 2026-08-25 pre-event OSM snapshot was clipped, topology-repaired under four thresholds, assigned
      class speeds, and linked to settlements and retained facilities.
    datasetPeriod: Pre-event baseline as of 2026-08-25
    datasetScale: 751,866 routed edge records and 3,068 settlement-topology records
    datasetSpatialResolution: Road edges and settlements in the three-district event scope and surrounding routing buffer
    datasetTemporalResolution: Static pre-event network with four topology scenarios
    datasetPreprocessingInfo: Geometry and duplicate checks, deterministic topology repair, class-speed travel times, and
      settlement snap-distance rules were applied.
  hazard_evidence:
    datasetSourceName: hazard_evidence_stack_20m.tif and hazard_evidence_class_20m.tif
    datasetDescription: Aligned multi-source change, mapped-event, channel, and slope evidence summarized as nested hazard-evidence
      confidence classes.
    datasetAttribute: raster
    datasetProvider: EU Copernicus, UNOSAT, HydroSHEDS, and research-team derivatives
    datasetGenerationInfo: Pre/post Sentinel-1 and Sentinel-2 evidence, independent rapid mapping, HydroRIVERS context, and
      Copernicus DEM slope were aligned to a 20 m UTM grid and combined by pre-specified rules.
    datasetPeriod: 2026-08-12 to 2026-08-28 event window
    datasetScale: 4,983 by 4,781 cells with seven evidence bands and one class raster
    datasetSpatialResolution: 20 m raster in WGS 84 / UTM zone 45N
    datasetTemporalResolution: Event-window composite
    datasetPreprocessingInfo: Source masks, cloud validity, NoData, independent evidence, channel buffers, and nested class
      logic were retained explicitly.
  hazard_exposure:
    datasetSourceName: hazard_scenario_exposure_summary.parquet
    datasetDescription: Physical footprint and population, road, bridge, building, facility, settlement, and disruption-candidate
      exposure under three nested evidence thresholds.
    datasetAttribute: table
    datasetProvider: Research-team overlay of EU Copernicus, UNOSAT, OpenStreetMap, WorldPop, and census inputs
    datasetGenerationInfo: The class-3 primary, class-2 alternative, and class-1 sensitivity footprints were overlaid with
      calibrated population and infrastructure layers.
    datasetPeriod: August 2026 event window with 2021/2024 population and 2026 pre-event infrastructure baselines
    datasetScale: Three nested hazard scenarios
    datasetSpatialResolution: 20 m hazard grid summarized to event-corridor features and population cells
    datasetTemporalResolution: Three pre-specified evidence thresholds
    datasetPreprocessingInfo: Exposure was counted as spatial intersection or proximity and was not interpreted as confirmed
      damage.
  network_disruption:
    datasetSourceName: settlement_disruption_accessibility_robustness_preprocessed.parquet
    datasetDescription: Settlement-level shortest-path outcomes for evidence-linked road closures, facility availability,
      topology, and snap-distance scenarios.
    datasetAttribute: table
    datasetProvider: Research-team network simulation using OpenStreetMap and Copernicus EMSR927 evidence
    datasetGenerationInfo: Evidence-linked graph edges were closed under 192 structural scenarios and shortest paths to retained
      health or emergency destinations were recomputed.
    datasetPeriod: August 2026 disruption on the pre-event road baseline
    datasetScale: 147,264 settlement-scenario records across 767 settlements and 192 scenarios
    datasetSpatialResolution: Settlement and road-network scale in the three-district event scope
    datasetTemporalResolution: Scenario-based static disruption simulations
    datasetPreprocessingInfo: Baseline eligibility, finite delays, newly isolated settlements, closure lengths, and destination
      removals were retained separately.
  population_accessibility:
    datasetSourceName: settlement_population_allocation_sensitivity_preprocessed.parquet and accessibility_scenario_population_summary_preprocessed.parquet
    datasetDescription: Census-calibrated population allocation to settlements and population-weighted accessibility outcomes.
    datasetAttribute: table
    datasetProvider: WorldPop Research Programme, National Statistics Office Nepal, OpenStreetMap, and research-team derivatives
    datasetGenerationInfo: WorldPop 2024 distribution was calibrated to 2021 census totals, assigned within local units to
      nearest settlements under four thresholds, and linked to accessibility outcomes.
    datasetPeriod: 2021 census totals, 2024 distribution, and August 2026 disruption
    datasetScale: 767 settlements, 228,289 positive population cells, four allocation thresholds, and scenario summaries
    datasetSpatialResolution: Approximately 100 m population cells allocated to mapped settlements within local units
    datasetTemporalResolution: Four allocation-distance specifications with a 3,000 m primary threshold
    datasetPreprocessingInfo: Allocated and unallocated population were preserved; the primary threshold allocates 573,645
      people (90.2%) and leaves 62,145 (9.8%) unallocated.
  vulnerability_estimates:
    datasetSourceName: nlss_iv_bagmati_district_vulnerability_domains_preprocessed.parquet
    datasetDescription: Survey-weighted Bagmati district deprivation domains, clustered uncertainty, reliability categories,
      and shrinkage-adjusted sensitivity context.
    datasetAttribute: table
    datasetProvider: National Statistics Office Nepal; research-team estimates
    datasetGenerationInfo: NLSS IV household measures were combined into three domains, estimated with survey weights and
      PSU-clustered uncertainty, and shrinkage-adjusted toward Bagmati references.
    datasetPeriod: 2022/23
    datasetScale: 39 district-domain records across 13 Bagmati districts
    datasetSpatialResolution: District-level supported reporting domains; no household value is downscaled to settlements
    datasetTemporalResolution: Cross-sectional supported-domain estimates
    datasetPreprocessingInfo: Missing components were not imputed; uncertainty, effective sample size, cluster support, and
      reliability categories were retained.
  survey_supported_domains:
    datasetSourceName: nccs_2022_supported_domain_preparedness_preprocessed.parquet and hrvs_2016_2018_supported_domain_shock_coping_preprocessed.parquet
    datasetDescription: Supported-domain preparedness, assistance, and harmful-coping estimates with survey uncertainty and
      coverage boundaries.
    datasetAttribute: table
    datasetProvider: National Statistics Office Nepal and World Bank; research-team estimates
    datasetGenerationInfo: NCCS indicators were estimated for supported Bagmati ecological belts and HRVS indicators by observed
      district-year with survey weights and clustered uncertainty.
    datasetPeriod: 2016-2018 and 2022
    datasetScale: 12 NCCS domain-indicator rows and 24 HRVS district-year-indicator rows
    datasetSpatialResolution: Survey-supported ecological-belt or observed district-year domains; no settlement downscaling
    datasetTemporalResolution: Cross-sectional NCCS context and annual HRVS panel context
    datasetPreprocessingInfo: Eligible denominators, cluster counts, effective sample sizes, missing shares, and reliability
      labels were retained.
  settlement_priority_robustness:
    datasetSourceName: settlement_intervention_priority_preprocessed.parquet and settlement_priority_robustness_preprocessed.parquet
    datasetDescription: Primary and sensitivity settlement priorities plus structural, allocation, weighting, and family-balanced
      robustness summaries.
    datasetAttribute: table
    datasetProvider: Research-team decision-analysis derivatives
    datasetGenerationInfo: Hazard, population, and isolation components were scaled within eligible scenario sets; district
      context was added only in a separately labelled sensitivity score; robustness families were summarized separately and
      equally balanced.
    datasetPeriod: August 2026 event analysis
    datasetScale: 767 settlements; 192 structural, four allocation, and 10,007 weighting or functional-form specifications
    datasetSpatialResolution: Mapped settlements in the three-district event scope
    datasetTemporalResolution: Primary scenario plus three robustness families
    datasetPreprocessingInfo: Tied midranks, isolation-preserving accessibility scoring, explicit eligibility, seeded weight
      draws, and equal one-third family weights were used.
  road_repair_benefits:
    datasetSourceName: road_repair_candidate_benefits_preprocessed.parquet and settlement_road_repair_benefits_preprocessed.parquet
    datasetDescription: Single-road-section screening results that separate population reconnection from finite travel-time
      improvement.
    datasetAttribute: table
    datasetProvider: Research-team network simulation using OpenStreetMap and Copernicus EMSR927 evidence
    datasetGenerationInfo: Each primary closed OSM road feature was reopened alone while every other primary closure remained
      fixed and the network was fully rerouted.
    datasetPeriod: August 2026 primary disruption scenario
    datasetScale: 194 road candidates and 148,798 candidate-settlement records
    datasetSpatialResolution: Road-section and settlement scale in the event-corridor network
    datasetTemporalResolution: One-at-a-time repair-screening simulations
    datasetPreprocessingInfo: Non-overlapping edge groups and non-worsening paths were checked; outputs are screening evidence,
      not engineering repair orders.
  road_repair_portfolios:
    datasetSourceName: road_repair_portfolio_scenarios_preprocessed.parquet and road_repair_portfolio_summary_preprocessed.parquet
    datasetDescription: Jointly rerouted, count-constrained road-repair portfolios and their structural-scenario retention.
    datasetAttribute: table
    datasetProvider: Research-team network simulation
    datasetGenerationInfo: A nested forward sequence selected portfolios of 1, 2, 3, and 5 road sections using lexicographic
      reconnection and finite-improvement benefits, then evaluated each fixed portfolio across all structural scenarios.
    datasetPeriod: August 2026 disruption scenarios
    datasetScale: Four reported portfolios and 768 portfolio-scenario records
    datasetSpatialResolution: Road-network portfolio and structural-scenario scale
    datasetTemporalResolution: Four portfolio sizes across 192 structural scenarios
    datasetPreprocessingInfo: Every portfolio was jointly rerouted; zero marginal gains at sizes 3 and 5 were preserved as
      a benefit plateau rather than suppressed.
